rules:
  - id: hardcoded-secret-assignment
    languages: [java, kotlin]
    severity: ERROR
    message: "Possible hardcoded secret/credential assigned as a string literal"
    metadata:
      cwe: ["CWE-798"]
      category: security
      fix_suggestion: |
        Move secrets out of source code into environment variables, a secrets
        manager (e.g. Vault, AWS Secrets Manager), or Spring Cloud Config with
        encryption at rest.
    pattern-regex: '(?i)(password|secret|apikey|api_key|token)\s*=\s*"[^"]{4,}"'
