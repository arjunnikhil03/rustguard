[workspace]
resolver = "2"
members = [
    "crates/rustguard-cli",
    "crates/rustguard-parser",
    "crates/rustguard-ir",
    "crates/rustguard-taint",
    "crates/rustguard-spring",
    "crates/rustguard-rules",
    "crates/rustguard-report",
    "crates/rustguard-cache",
    "crates/rustguard-external",
    "crates/rustguard-redmine",
    "crates/rustguard-git",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Your Security Engineering Team"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "=0.9.19"
clap = { version = "=4.4.18", features = ["derive"] }
walkdir = "2"
regex = "1"
